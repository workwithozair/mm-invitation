<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RSVP</title><style>:root{--sage:#929b83;--ink:#3f473d;--paper:#fbf8f2}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:Georgia,serif;padding:24px;display:grid;place-items:center}.card{width:min(100%,620px);padding:clamp(28px,6vw,58px);background:#fff;border:1px solid #ded8cc;box-shadow:0 18px 60px #59614c20}.eyebrow,label,legend,.note,.status{font:11px Arial,sans-serif;letter-spacing:.12em}.eyebrow{text-align:center;color:var(--sage)}h1{text-align:center;font-size:42px;font-weight:400;margin:12px 0}.intro{text-align:center;line-height:1.6;margin-bottom:28px}label{display:block;margin:16px 0 6px}input,select,textarea{display:block;width:100%;margin-top:7px;padding:12px;border:1px solid #d7d0c2;background:#fff;font:15px Georgia,serif;color:var(--ink)}fieldset{border:1px solid #e2ddd2;margin:14px 0;padding:12px}legend{padding:0 6px}button,.back{display:inline-block;margin-top:20px;padding:13px 22px;background:var(--sage);border:0;color:white;text-decoration:none;font:11px Arial,sans-serif;letter-spacing:.12em;cursor:pointer}.back{background:transparent;color:var(--sage);border:1px solid var(--sage)}.status{margin-top:16px;line-height:1.5}.note{line-height:1.5;color:#6b705f;letter-spacing:.04em}</style><link rel="icon" type="image/svg+xml" href="/assets/favicon.svg"></head><body><main class="card"><p class="eyebrow">KINDLY REPLY</p><h1 id="heading">Will you join us?</h1><p class="intro">Your presence and prayers mean the world to us.</p><form id="form"><label>GUEST FULL NAME<input name="name" autocomplete="name" required placeholder="Full name"></label><div id="events"></div><label>NUMBER OF GUESTS<select name="guests" id="guests"></select></label><label id="contactLabel" hidden>CONTACT NUMBER<input name="contactNumber" type="tel"></label><label id="messageLabel">WISHES &amp; DU’A (OPTIONAL)<textarea name="notes" rows="3"></textarea></label><p class="note" id="guestNote"></p><button type="submit">SUBMIT RSVP</button></form><p class="status" id="status" role="status"></p><a class="back" href="/">BACK TO INVITATION</a></main><script>
(async()=>{const d=await fetch('/data.json').then(r=>r.json()),r=d.rsvp||{},f=document.querySelector('#form'),status=document.querySelector('#status');document.title=`RSVP · ${d.couple.displayNames}`;document.querySelector('#heading').textContent=`Will you join ${d.couple.displayNames}?`;if(r.enabled===false){f.hidden=true;status.textContent='RSVP details will be shared soon.';return}document.querySelector('#contactLabel').hidden=!r.contactNumberRequired;document.querySelector('#messageLabel').hidden=!r.guestMessageEnabled;document.querySelector('#messageLabel textarea').placeholder=r.guestMessagePlaceholder||'Leave a message for the couple';const ev=document.querySelector('#events');ev.innerHTML=(r.events||[]).map(x=>`<fieldset><legend>${x.title}${x.timeTentative?' · time to be confirmed':''}</legend><label>Attendance<select name="event_${x.id}" required><option value="" disabled selected>Please choose</option>${(r.attendanceOptions||['Attending','Unable to attend']).map(o=>`<option>${o}</option>`).join('')}</select></label></fieldset>`).join('');const n=Math.max(1,Number(r.allocatedGuestCount)||2);document.querySelector('#guests').innerHTML=Array.from({length:n},(_,i)=>`<option value="${i+1}">${i+1} ${i?'guests':'guest'}</option>`).join('');document.querySelector('#guestNote').textContent=r.allocatedGuestCount?`Please use your allocated guest count of ${r.allocatedGuestCount}. Extra guests require prior approval.${r.childrenAllowed?' Children are welcome.':''}`:'';f.addEventListener('submit',async e=>{e.preventDefault();const endpoint=r.appsScriptUrl||'';if(!/^https:\/\/script\.google\.com\/macros\/s\//.test(endpoint)){status.textContent='RSVP submission is not configured yet. Please contact the couple on WhatsApp.';return}const submit=f.querySelector('[type=submit]');submit.disabled=true;status.textContent='Submitting your RSVP…';const payload=new URLSearchParams(Object.fromEntries(new FormData(f).entries()));payload.set('submittedAt',new Date().toISOString());payload.set('couple',d.couple.displayNames);try{await fetch(endpoint,{method:'POST',mode:'no-cors',body:payload});status.textContent='Your RSVP request has been sent. Thank you!';f.querySelectorAll('input,select,textarea,button').forEach(x=>x.disabled=true)}catch(err){status.textContent='Could not send your RSVP. Please try again or contact the couple.';submit.disabled=false}})})().catch(()=>{document.querySelector('#status').textContent='Unable to load RSVP details. Please refresh and try again.'});
</script><script src="/assets/share.js" defer></script></body></html>
