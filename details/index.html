<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reception Details</title>
  <style>
    :root{--sage:#929b83;--ink:#3f473d;--paper:#fbf8f2;--gold:#b39b70}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:var(--paper);color:var(--ink);font-family:Georgia,'Times New Roman',serif}.card{width:min(100%,760px);min-height:540px;padding:clamp(32px,8vw,78px);text-align:center;border:1px solid #d7d0c2;background:linear-gradient(#ffffffb8,#ffffffb8),url('../_assets/media/83c4abb0c54695b2aa86aaddaacf4583.png') center/cover;box-shadow:0 18px 60px #59614c20;display:flex;flex-direction:column;align-items:center;justify-content:center}.eyebrow{font:11px Arial,sans-serif;letter-spacing:.24em;color:var(--sage)}h1{font-size:clamp(38px,7vw,64px);font-weight:400;margin:14px 0 8px}h2{font-size:23px;font-weight:400;color:var(--gold);margin:0 0 30px}.info{font-size:18px;line-height:1.8}.venue{font-size:23px;margin-top:12px}.countdown{margin:28px auto 0;padding:20px 18px;width:min(100%,480px);background:#e9ede3d9;border:1px solid #d9dfd0}.countdown-label{margin:0;color:#657553;font:10px Arial,sans-serif;letter-spacing:.2em}.countdown-row{display:flex;justify-content:center;align-items:center;gap:clamp(10px,3vw,28px);margin-top:15px}.countdown-unit{display:grid;gap:6px;min-width:48px}.countdown-unit strong{font:400 clamp(27px,6vw,40px)/1 Georgia,'Times New Roman',serif;font-variant-numeric:tabular-nums}.countdown-unit span{font:9px Arial,sans-serif;letter-spacing:.13em;color:#657553}.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:28px}a,button{border:1px solid var(--sage);padding:13px 22px;background:var(--sage);color:white;text-decoration:none;font:11px Arial,sans-serif;letter-spacing:.12em;cursor:pointer}a.secondary{background:transparent;color:var(--ink)}.back{margin-top:22px;background:transparent;color:var(--ink);font:11px Arial,sans-serif;letter-spacing:.14em;text-decoration:none;border:1px solid var(--sage);padding:12px 20px}
  </style>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg"></head>
<body><main class="card"><p class="eyebrow">YOU’RE INVITED</p><h1 id="names">Masoom &amp; Miza</h1><h2>Reception</h2><div class="info"><div id="dateTime"></div><div class="venue" id="venue"></div><div id="address"></div></div><section class="countdown" id="countdown" aria-label="Countdown to the reception"><p class="countdown-label">COUNTING DOWN TO OUR CELEBRATION</p><div class="countdown-row" aria-live="off"><div class="countdown-unit"><strong id="days">000</strong><span>DAYS</span></div><div class="countdown-unit"><strong id="hours">00</strong><span>HOURS</span></div><div class="countdown-unit"><strong id="minutes">00</strong><span>MINUTES</span></div><div class="countdown-unit"><strong id="seconds">00</strong><span>SECONDS</span></div></div></section><div class="actions"><a id="map" target="_blank" rel="noopener">OPEN MAP</a><button id="rsvp">RSVP</button></div><a class="back" href="../envelope/">BACK TO ENVELOPE</a></main>
<script>
fetch('../data.json').then(r=>{if(!r.ok)throw new Error('Could not load invitation data');return r.json()}).then(d=>{
  const e=d.wedding.reception;
  document.title=`${e.title} · ${d.couple.displayNames}`;
  document.querySelector('#names').textContent=d.couple.displayNames;
  document.querySelector('#dateTime').textContent=[e.date,d.wedding.day,e.time].filter(Boolean).join(' · ');
  document.querySelector('#venue').textContent=e.venue;
  document.querySelector('#address').textContent=e.address;
  document.querySelector('#map').href=e.mapsUrl;
  document.querySelector('#rsvp').onclick=()=>location.href='../rsvp/index.html';

  const countdown=document.querySelector('#countdown');
  const target=new Date(d.wedding.date).getTime();
  if(d.features?.countdownDisplay===false||d.design?.countdown?.enabled===false||!Number.isFinite(target)){
    countdown.hidden=true;
    return;
  }
  const updateCountdown=()=>{
    const remaining=Math.max(0,target-Date.now());
    const days=Math.floor(remaining/86400000);
    const hours=Math.floor(remaining%86400000/3600000);
    const minutes=Math.floor(remaining%3600000/60000);
    const seconds=Math.floor(remaining%60000/1000);
    document.querySelector('#days').textContent=String(days).padStart(3,'0');
    document.querySelector('#hours').textContent=String(hours).padStart(2,'0');
    document.querySelector('#minutes').textContent=String(minutes).padStart(2,'0');
    document.querySelector('#seconds').textContent=String(seconds).padStart(2,'0');
  };
  updateCountdown();
  setInterval(updateCountdown,1000);
}).catch(error=>console.error('Could not load details page data',error));
</script><script src="../assets/share.js" defer></script></body></html>
